services:
  nginx:
    image: nginx:latest
    network_mode: "host"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
    restart: always

  flask-app:
    image: python:3.12-slim
    command: ["python", "-c", "print('Flask placeholder - install dependencies and run your app')"]
    network_mode: "host"
    environment:
      DATABASE_URL: postgres://user:password@localhost:5432/mydb
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    network_mode: "host"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: